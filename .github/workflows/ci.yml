# ============================================
# ИМЯ ПАЙПЛАЙНА (отображается в GitHub Actions)
# ============================================
name: LMS CI/CD Pipeline

# ============================================
# КОГДА ЗАПУСКАТЬ
# ============================================
on: [push, pull_request]          # При каждом пуше и создании Pull Request

# ============================================
# ЗАДАЧИ (JOBS)
# ============================================
jobs:

  # ==========================================
  # ЭТАП 1: ЛИНТИНГ
  # ==========================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction

      - name: Run flake8
        run: flake8 . --max-line-length=119

  # ==========================================
  # ЭТАП 2: ТЕСТЫ
  # ==========================================
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction

      - name: Run migrations
        env:
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          HOST: 127.0.0.1
          PORT: 5432
          SECRET_KEY: django-insecure-test-key-for-ci
          DEBUG: "False"
        run: python manage.py migrate

      - name: Run tests
        env:
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          HOST: 127.0.0.1
          PORT: 5432
          SECRET_KEY: django-insecure-test-key-for-ci
          DEBUG: "False"
        run: python manage.py test

  # ==========================================
  # ЭТАП 3: СБОРКА DOCKER-ОБРАЗА
  # ==========================================
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/lms:${{ github.sha }}

  # ==========================================
  # ЭТАП 4: ДЕПЛОЙ НА СЕРВЕР
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/lms:${{ github.sha }}
            docker stop lms || true
            docker rm lms || true
            docker run -d --name lms -p 8000:8000 \
              --env-file /home/lms/.env.docker \
              ${{ secrets.DOCKER_HUB_USERNAME }}/lms:${{ github.sha }}
          EOF