name: LMS CI/CD Pipeline

on: [push, pull_request]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction || true
          # --- РЕШАЮЩИЙ МОМЕНТ: принудительно переустановить проблемные пакеты через pip ---
          pip install --upgrade django-celery-beat django-timezone-field python-crontab cron-descriptor
      - name: Run Flake8
        run: flake8 . --max-line-length=119

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction || true
          # --- РЕШАЮЩИЙ МОМЕНТ: принудительно переустановить проблемные пакеты через pip ---
          pip install --upgrade django-celery-beat django-timezone-field python-crontab cron-descriptor
      - name: Verify celery-beat
        run: python -c "import django_celery_beat; print('✅ Celery Beat OK')"
      - name: Run migrations
        env:
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          HOST: 127.0.0.1
          PORT: 5432
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 0
          SECRET_KEY: test-secret-key-for-tests-only
          DEBUG: "True"
        run: python manage.py migrate

      - name: Run tests
        env:
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          HOST: 127.0.0.1
          PORT: 5432
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 0
          SECRET_KEY: test-secret-key-for-tests-only
          DEBUG: "True"
        run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/lms:${{ github.sha }} .
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/lms:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug secrets (временно)
        run: |
          echo "SERVER_IP is [${{ secrets.SERVER_IP }}]"
          echo "SSH_USER is [${{ secrets.SSH_USER }}]"
          echo "DOCKER_HUB_USERNAME is [${{ secrets.DOCKER_HUB_USERNAME }}]"

      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo "Starting deployment to $SERVER_IP"
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

          ssh "$SSH_USER@$SERVER_IP" "
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/lms:${{ github.sha }}
            docker stop lms || true
            docker rm lms || true
            docker run -d --name lms -p 8000:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/lms:${{ github.sha }}
          "
